<div id="ra-data-dictionary">
<style>
#ra-data-dictionary {
    --ra-bg: #ffffff;
    --ra-surface: #f8fafc;
    --ra-border: #e2e8f0;
    --ra-text: #1e293b;
    --ra-text-dim: #64748b;
    --ra-accent: #0066cc;
    --ra-accent-light: #e0f2fe;
    
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ra-text);
    line-height: 1.6;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

#ra-data-dictionary * {
    box-sizing: border-box;
}

#ra-data-dictionary h2 {
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 8px 0;
    color: var(--ra-text);
}

#ra-data-dictionary .ra-subtitle {
    color: var(--ra-text-dim);
    margin-bottom: 20px;
    font-size: 15px;
}

#ra-data-dictionary .ra-search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

#ra-data-dictionary .ra-search {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: 1px solid var(--ra-border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

#ra-data-dictionary .ra-search:focus {
    border-color: var(--ra-accent);
    box-shadow: 0 0 0 3px var(--ra-accent-light);
}

#ra-data-dictionary .ra-category-filter {
    padding: 10px 14px;
    border: 1px solid var(--ra-border);
    border-radius: 8px;
    font-size: 15px;
    background: white;
    cursor: pointer;
    min-width: 180px;
}

#ra-data-dictionary .ra-field-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

#ra-data-dictionary .ra-field-card {
    background: var(--ra-surface);
    border: 1px solid var(--ra-border);
    border-radius: 10px;
    padding: 16px 20px;
    transition: box-shadow 0.15s;
}

#ra-data-dictionary .ra-field-card:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

#ra-data-dictionary .ra-field-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
}

#ra-data-dictionary .ra-field-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--ra-text);
    margin: 0;
}

#ra-data-dictionary .ra-field-category {
    font-size: 12px;
    padding: 4px 10px;
    background: var(--ra-accent-light);
    color: var(--ra-accent);
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 500;
}

#ra-data-dictionary .ra-field-desc {
    color: var(--ra-text-dim);
    font-size: 14px;
    margin: 0;
    line-height: 1.5;
}

#ra-data-dictionary .ra-code-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 13px;
    color: var(--ra-accent);
    cursor: pointer;
    text-decoration: none;
}

#ra-data-dictionary .ra-code-link:hover {
    text-decoration: underline;
}

#ra-data-dictionary .ra-empty {
    text-align: center;
    padding: 40px;
    color: var(--ra-text-dim);
}

#ra-data-dictionary .ra-count {
    font-size: 14px;
    color: var(--ra-text-dim);
    margin-bottom: 16px;
}

/* Modal */
#ra-data-dictionary .ra-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    padding: 20px;
}

#ra-data-dictionary .ra-modal-overlay.open {
    display: flex;
}

#ra-data-dictionary .ra-modal {
    background: white;
    border-radius: 12px;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

#ra-data-dictionary .ra-modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--ra-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#ra-data-dictionary .ra-modal-header h3 {
    margin: 0;
    font-size: 18px;
}

#ra-data-dictionary .ra-modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--ra-text-dim);
    padding: 0;
    line-height: 1;
}

#ra-data-dictionary .ra-modal-close:hover {
    color: var(--ra-text);
}

#ra-data-dictionary .ra-modal-body {
    padding: 20px;
    overflow-y: auto;
}

#ra-data-dictionary .ra-modal-desc {
    color: var(--ra-text-dim);
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--ra-border);
    font-size: 14px;
}

#ra-data-dictionary .ra-code-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

#ra-data-dictionary .ra-code-table th {
    text-align: left;
    padding: 10px 12px;
    background: var(--ra-surface);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--ra-text-dim);
    letter-spacing: 0.5px;
}

#ra-data-dictionary .ra-code-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--ra-border);
}

#ra-data-dictionary .ra-code-value {
    font-family: monospace;
    background: var(--ra-surface);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
}
</style>

    const searchInput = document.getElementById('ra-search');
    const categorySelect = document.getElementById('ra-category');
    const fieldsContainer = document.getElementById('ra-fields');
    const countEl = document.getElementById('ra-count');
    const modal = document.getElementById('ra-modal');
    const modalTitle = document.getElementById('ra-modal-title');
    const modalBody = document.getElementById('ra-modal-body');
    const modalClose = document.getElementById('ra-modal-close');
    
    // Populate categories
    DATA.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
    });
    
    function render() {
        const query = searchInput.value.toLowerCase();
        const category = categorySelect.value;
        
        let fields = DATA.fields.filter(f => {
            const matchesQuery = !query || 
                f.display_name.toLowerCase().includes(query) ||
                f.description.toLowerCase().includes(query);
            const matchesCategory = !category || f.category === category;
            return matchesQuery && matchesCategory;
        });
        
        countEl.textContent = `Showing ${fields.length} of ${DATA.fields.length} fields`;
        
        if (fields.length === 0) {
            fieldsContainer.innerHTML = '<div class="ra-empty">No fields match your search</div>';
            return;
        }
        
        fieldsContainer.innerHTML = fields.map(f => {
            const codeLink = f.code_group 
                ? `<a class="ra-code-link" data-code="${f.code_group}">View ${f.code_group} codes →</a>`
                : '';
            
            const subCat = f.sub_category ? ` · ${f.sub_category}` : '';
            
            return `
                <div class="ra-field-card">
                    <div class="ra-field-header">
                        <h4 class="ra-field-name">${f.display_name}</h4>
                        <span class="ra-field-category">${f.category}${subCat}</span>
                    </div>
                    <p class="ra-field-desc">${f.description}</p>
                    ${codeLink}
                </div>
            `;
        }).join('');
        
        // Bind code links
        fieldsContainer.querySelectorAll('.ra-code-link').forEach(el => {
            el.addEventListener('click', () => openModal(el.dataset.code));
        });
    }
    
    function openModal(codeGroup) {
        const codeData = DATA.codes[codeGroup];
        if (!codeData) return;
        
        modalTitle.textContent = `${codeGroup} codes (${codeData.codes.length})`;
        
        let html = '';
        if (codeData.description) {
            html += `<p class="ra-modal-desc">${codeData.description}</p>`;
        }
        
        html += `
            <table class="ra-code-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Meaning</th>
                    </tr>
                </thead>
                <tbody>
                    ${codeData.codes.map(c => `
                        <tr>
                            <td><span class="ra-code-value">${c.code}</span></td>
                            <td>${c.display_value}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        
        modalBody.innerHTML = html;
        modal.classList.add('open');
    }
    
    function closeModal() {
        modal.classList.remove('open');
    }
    
    searchInput.addEventListener('input', render);
    categorySelect.addEventListener('change', render);
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    
    render();
})();
